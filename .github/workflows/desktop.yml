name: Desktop packages
on:
  workflow_dispatch:
  push:
    tags: ['v*']
    branches: ['arena/e423f162-lumiere']
permissions:
  contents: read
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: mac
          - os: windows-latest
            target: win
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run desktop:prepare
      - run: npx electron-builder --${{ matrix.target }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - run: node scripts/desktop-smoke.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: Lumiere-${{ matrix.target }}
          path: |
            release/*.dmg
            release/*.zip
            release/*Setup.exe
          if-no-files-found: error
