name: Desktop packages
on:
  workflow_dispatch:
  push:
    tags: ['v*']
    branches: ['arena/e423f162-lumiere']
permissions:
  contents: read
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: mac
          - os: windows-latest
            target: win
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - name: Build standalone server
        shell: bash
        run: |
          set -o pipefail
          npm run desktop:prepare 2>&1 | tee native-build.log
      - name: Report build failure
        if: failure()
        shell: bash
        run: |
          node -e "const fs=require('fs'); if(fs.existsSync('native-build.log')) console.log('::error::'+fs.readFileSync('native-build.log','utf8').slice(-12000).replaceAll('%','%25').replaceAll('\\r','%0D').replaceAll('\\n','%0A'));"
      - run: npx electron-builder --${{ matrix.target }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - run: node scripts/desktop-smoke.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: Lumiere-${{ matrix.target }}
          path: |
            release/*.dmg
            release/*.zip
            release/*Setup.exe
          if-no-files-found: error
