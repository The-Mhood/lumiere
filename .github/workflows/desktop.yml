name: Desktop packages
on:
  workflow_dispatch:
  push:
    tags: ['v*']
    branches: ['arena/e423f162-lumiere']
permissions:
  contents: read
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15-intel
            target: mac
          - os: windows-latest
            target: win
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - name: Build standalone server
        shell: bash
        run: |
          set -o pipefail
          npm run desktop:prepare 2>&1 | tee native-build.log
      - name: Report build failure
        if: failure()
        shell: bash
        run: |
          node -e "const fs=require('fs'); if(fs.existsSync('native-build.log')) console.log('::error::'+fs.readFileSync('native-build.log','utf8').slice(-12000).replaceAll('%','%25').replaceAll('\\r','%0D').replaceAll('\\n','%0A'));"
      - name: Package native application
        shell: bash
        run: |
          set -o pipefail
          if [ "${{ matrix.target }}" = "mac" ]; then
            npx electron-builder --mac --config.mac.identity=- --config.mac.hardenedRuntime=false --publish never 2>&1 | tee native-package.log
          else
            npx electron-builder --win --publish never 2>&1 | tee native-package.log
          fi
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Launch packaged application
        timeout-minutes: 6
        env:
          LUMIERE_LIVE_MEDIA_TEST: '1'
        shell: bash
        run: |
          set -o pipefail
          node scripts/desktop-smoke.mjs 2>&1 | tee native-smoke.log
      - name: Report native failure
        if: failure()
        shell: bash
        run: |
          node scripts/report-native-failure.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Lumiere-${{ matrix.target }}
          path: |
            release/*.dmg
            release/*.zip
            release/*Setup.exe
          if-no-files-found: error
