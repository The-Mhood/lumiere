name: Preview connectivity probe
on:
  workflow_dispatch:
  push:
    branches: ['arena/e423f162-lumiere']
    paths: ['.github/workflows/preview-connectivity.yml']
permissions:
  contents: read
  deployments: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Verify deployed playable-only browsing and platform navigation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module - <<'JS'
          const headers = {Authorization: `Bearer ${process.env.GH_TOKEN}`, Accept: 'application/vnd.github+json'};
          const api = async path => { const response = await fetch(`https://api.github.com/repos/${process.env.GITHUB_REPOSITORY}/${path}`, {headers}); if (!response.ok) throw new Error(`GitHub HTTP ${response.status}`); return response.json(); };
          const [deployment] = await api('deployments?environment=lumiere-preview&per_page=1');
          const [status] = await api(`deployments/${deployment.id}/statuses`);
          const endpoint = status.environment_url;
          const get = async path => { const response = await fetch(endpoint + path, {signal: AbortSignal.timeout(30000)}); if (!response.ok) throw new Error(`${path}: HTTP ${response.status}`); return response.text(); };
          const home = await get('/');
          for (const text of ['Cinejoy catalogue', 'Big Buck Bunny', 'Sintel', 'Caminandes']) if (home.includes(text)) throw new Error(`Unexpected public catalogue fixture/rail: ${text}`);
          const platforms = await get('/platforms');
          for (const text of ['Netflix', 'Prime Video', 'HBO Max']) if (!platforms.includes(text)) throw new Error(`Missing platform: ${text}`);
          const netflix = await get('/platforms/8');
          if (!netflix.includes('Netflix')) throw new Error('Platform detail route failed');
          if (netflix.includes('Big Buck Bunny')) throw new Error('Platform route fell back to unrelated demo content');
          const report = { endpoint, deployment: deployment.id, homepage: 'no demo fixtures or branded rail', platforms: 'Netflix, Prime Video, HBO Max routes passed', playback: status.description };
          console.log('::notice title=Deployed catalogue UI verification::' + JSON.stringify(report));
          await api(`deployments/${deployment.id}/statuses`);
          JS
